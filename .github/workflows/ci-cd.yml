name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # CI: 문법 및 기본 검증
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript 문법 검사
        run: node --check app.js

      - name: HTML 필수 요소 검사
        run: |
          grep -q '<title>' index.html
          grep -q 'kakao.min.js' index.html
          grep -q 'app.js' index.html
          echo "HTML 검증 통과"

      - name: 비밀키 노출 검사 (실제 키가 커밋되지 않았는지)
        run: |
          if grep -rInE "(KakaoAK|Bearer) [0-9a-f]{32}" --include='*.js' --include='*.html' .; then
            echo "::error::실제 API 키로 보이는 문자열이 발견되었습니다!"
            exit 1
          fi
          echo "키 노출 없음"

  # CD: GitHub Pages를 "Deploy from a branch → main"으로 설정하면
  # main에 머지될 때마다 GitHub이 자동으로 사이트를 갱신합니다 (별도 잡 불필요).
