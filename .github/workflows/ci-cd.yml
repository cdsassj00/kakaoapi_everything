name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CI: 문법 및 기본 검증
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript 문법 검사
        run: node --check app.js

      - name: HTML 필수 요소 검사
        run: |
          grep -q '<title>' index.html
          grep -q 'kakao.min.js' index.html
          grep -q 'app.js' index.html
          echo "HTML 검증 통과"

      - name: 비밀키 노출 검사 (실제 키가 커밋되지 않았는지)
        run: |
          if grep -rInE "(KakaoAK|Bearer) [0-9a-f]{32}" --include='*.js' --include='*.html' .; then
            echo "::error::실제 API 키로 보이는 문자열이 발견되었습니다!"
            exit 1
          fi
          echo "키 노출 없음"

  # CD: main 브랜치에 머지되면 gh-pages 브랜치로 정적 파일 배포
  # (gh-pages 브랜치 방식은 GITHUB_TOKEN의 contents:write 권한만으로 동작)
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gh-pages 브랜치로 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github'
